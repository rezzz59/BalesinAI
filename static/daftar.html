<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Gratis — Balesin.ai</title>
  <meta name="description" content="Daftar Balesin.ai gratis, free trial 14 hari tanpa kartu kredit. AI WhatsApp untuk UMKM.">
<link rel="icon" href="/static/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/assets/landing.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<section class="auth-wrap">
  <div class="auth-card reveal">
    <span class="eyebrow">Coba gratis</span>
    <h1 class="display">Mulai obrol pertama</h1>
    <p class="sub">Free trial 14 hari, semua fitur Pro. Tanpa kartu kredit.</p>
    <form onsubmit="register(event)">
      <div class="field">
        <label for="name">Nama Anda</label>
        <input id="name" type="text" placeholder="Nama pemilik" autocomplete="name">
      </div>
      <div class="field">
        <label for="email2">Email</label>
        <input id="email2" type="email" placeholder="nama@tokokamu.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <div style="position:relative;">
          <input id="password" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required style="padding-right:44px;">
          <button type="button" onclick="togglePasswordVisibility('password', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;" title="Tampilkan/sembunyikan kata sandi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn primary" type="submit" id="regBtn">Buat Akun Gratis</button>
      <div class="auth-note" id="authNote"></div>
    </form>
    <p class="auth-alt">Sudah punya akun? <a href="/masuk">Masuk</a></p>
  </div>
</section>

<script>
  function togglePasswordVisibility(id, btn) {
    const inp = document.getElementById(id);
    const isPass = inp.type === 'password';
    inp.type = isPass ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isPass
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }

  async function register(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const note = document.getElementById('authNote');
    note.style.display = 'block';
    note.className = 'auth-note text-amber-700';
    note.textContent = 'Membuat akun...';
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email2').value.trim(),
          password: document.getElementById('password').value,
          full_name: document.getElementById('name').value.trim()
        })
      });
      const d = await res.json();
      if (!res.ok) { note.className = 'auth-note text-red-600'; note.textContent = d.detail || 'Gagal mendaftar.'; return; }
      window.location = '/onboard';
    } catch (err) {
      note.className = 'auth-note text-red-600';
      note.textContent = 'Error: ' + err.message;
    } finally { btn.disabled = false; }
  }
</script>
<script src="/static/assets/landing.js"></script>
</body>
</html>
