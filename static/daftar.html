<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Gratis — Balesin.ai</title>
  <meta name="description" content="Daftar Balesin.ai gratis, free trial 14 hari tanpa kartu kredit. AI WhatsApp untuk UMKM.">
<link rel="icon" href="/static/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/assets/landing.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<section class="auth-wrap">
  <div class="auth-card reveal">
    <span class="eyebrow">Coba gratis</span>
    <h1 class="display">Mulai obrol pertama</h1>
    <p class="sub">Free trial 14 hari, semua fitur Pro. Tanpa kartu kredit.</p>
    <form>
      <div class="field">
        <label for="store">Nama toko</label>
        <input id="store" type="text" placeholder="mis. Warung Kopi Nusantara" autocomplete="organization">
      </div>
      <div class="field">
        <label for="name">Nama Anda</label>
        <input id="name" type="text" placeholder="Nama pemilik" autocomplete="name">
      </div>
      <div class="field">
        <label for="wa">Nomor WhatsApp toko</label>
        <input id="wa" type="tel" placeholder="62812xxxxxxx" autocomplete="tel">
        <div class="hint">Dipakai untuk menerima notifikasi order &amp; komplain.</div>
      </div>
      <div class="field">
        <label for="email2">Email</label>
        <input id="email2" type="email" placeholder="nama@tokokamu.com" autocomplete="email">
      </div>
      <button class="btn primary" type="submit">Buat Akun Gratis</button>
      <div class="auth-note">Pendaftaran sedang disiapkan. Sementara itu, hubungi kami via WhatsApp dan kami pasangkan untuk Anda.</div>
    </form>
    <p class="auth-alt">Sudah punya akun? <a href="/masuk">Masuk</a></p>
  </div>
</section>

<script src="/static/assets/landing.js"></script>
