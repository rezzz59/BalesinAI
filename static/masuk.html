<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Balesin.ai</title>
  <meta name="description" content="Masuk ke akun Balesin.ai Anda.">
<link rel="icon" href="/static/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/assets/landing.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<section class="auth-wrap">
  <div class="auth-card reveal">
    <span class="eyebrow">Selamat datang kembali</span>
    <h1 class="display">Masuk ke akun Anda</h1>
    <p class="sub">Lanjut pantau order dan obrolan toko Anda.</p>
    <form onsubmit="login(event)">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nama@tokokamu.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit" id="loginBtn">Masuk</button>
      <div class="auth-note" id="authNote"></div>
    </form>
    <p class="auth-alt">Belum punya akun? <a href="/daftar">Coba gratis</a></p>
  </div>
</section>

<script>
  async function login(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const note = document.getElementById('authNote');
    note.style.display = 'block';
    note.className = 'auth-note text-amber-700';
    note.textContent = 'Memeriksa...';
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const d = await res.json();
      if (!res.ok) { note.className = 'auth-note text-red-600'; note.textContent = d.detail || 'Gagal masuk.'; return; }
      window.location = '/onboard';
    } catch (err) {
      note.className = 'auth-note text-red-600';
      note.textContent = 'Error: ' + err.message;
    } finally { btn.disabled = false; }
  }
</script>
<script src="/static/assets/landing.js"></script>
</body>
</html>
